apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-addition
  labels:
    app: java-addition
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-addition
  template:
    metadata:
      labels:
        app: java-addition
    spec:
      containers:
        - name: java-app
          image: java-addition-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: java-addition-service
spec:
  type: NodePort
  selector:
    app: java-addition
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30010
