<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Lab - Jenkins & Kubernetes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 36px 40px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #022c22;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: #ffffff;
      line-height: 1.2;
    }
    h2 {
      font-size: 1.15rem;
      color: #94a3b8;
      font-weight: 400;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 14px;
      margin: 24px 0;
      text-align: left;
    }
    .grid-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 14px;
    }
    .grid-item .label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .grid-item .value {
      font-size: 1rem;
      font-weight: 600;
      color: #38bdf8;
    }
    .pipeline-status {
      padding: 14px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 10px;
      color: #34d399;
      font-weight: 500;
      font-size: 0.95rem;
      margin-top: 10px;
    }
    footer {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">&#10003; Deployment Live</div>
    <h1>DevOps &amp; Agile Lab</h1>
    <h2>Kubernetes Implemented Through Jenkins CI/CD</h2>

    <div class="grid">
      <div class="grid-item">
        <div class="label">Platform</div>
        <div class="value">Kubernetes</div>
      </div>
      <div class="grid-item">
        <div class="label">Automation</div>
        <div class="value">Jenkins</div>
      </div>
      <div class="grid-item">
        <div class="label">Container</div>
        <div class="value">Docker (Nginx)</div>
      </div>
      <div class="grid-item">
        <div class="label">Status</div>
        <div class="value" style="color: #4ade80;">Active / Ready</div>
      </div>
    </div>

    <div class="pipeline-status">
      &#128640; CI/CD Pipeline Deployed Successfully to Local Cluster!
    </div>

    <footer>
      Agile Development Process and DevOps Lab &bull; Lab Sets 1 &ndash; 15
    </footer>
  </div>
</body>
</html>
